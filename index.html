<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spelling Practice</title>
<style>
  html, body { height: 100%; margin: 0; background: #fdf8f1; }
  .wait {
    height: 100%; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #b8ada0; font-size: 15px; font-weight: 700;
  }
</style>
</head>
<body>
<!--
  This page exists only to hand over to the app, and it never changes, so it
  does not matter if a browser holds on to it. The app itself is fetched with
  the moment stamped on the end, which no cache can match. That is what stops
  anyone being stuck on an old version, whatever their browser decides to keep.
  Everything saved — words, groups, settings, the sync key — lives with the
  site rather than the page, so it all carries straight over.
-->
<div class="wait">Opening…</div>
<script>
  var to = 'app.html?v=' + Date.now() + (location.hash || '');
  location.replace(to);
</script>
</body>
</html>
